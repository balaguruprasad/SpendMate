# Cloud Build pipeline: build the frontend image, push to Artifact Registry,
# and deploy to Cloud Run (asia-south1).
#
# Submit manually:
#   gcloud builds submit --config cloudbuild.yaml \
#     --substitutions=_API_BASE_URL=https://api-finance.mesaschool.co.in/api/v1
#
# Override any substitution (e.g. _REGION, _SERVICE) on the command line as needed.

substitutions:
  _REGION: asia-south1
  _REPO: mesa-finance              # Artifact Registry repo (create once, see DEPLOY.md)
  _SERVICE: mesa-finance-frontend  # Cloud Run service name
  _API_BASE_URL: https://api-finance.mesaschool.co.in/api/v1
  _USE_MOCK: "false"

steps:
  # 1. Build the image (NEXT_PUBLIC_* baked in via build args).
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --build-arg=NEXT_PUBLIC_API_BASE_URL=${_API_BASE_URL}
      - --build-arg=NEXT_PUBLIC_USE_MOCK=${_USE_MOCK}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - .

  # 2. Push both tags.
  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}

  # 3. Deploy to Cloud Run.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=512Mi
      - --min-instances=0
      - --max-instances=10

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
